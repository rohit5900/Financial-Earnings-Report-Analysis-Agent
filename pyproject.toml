[project]
name = "financial-earnings-analysis-desk"
version = "0.1.0"
description = "A Semantic Kernel multi-agent workflow for grounded earnings analysis"
requires-python = ">=3.11"
dependencies = [
    "semantic-kernel>=1.30,<2.0",
    "streamlit>=1.40",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.scripts]
earnings-desk = "earnings_desk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["earnings_desk*"]
